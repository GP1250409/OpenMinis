name: Accordion UIKit regression
on:
  push:
    branches: [mod-native-accordion-20261029]
  workflow_dispatch:
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run production accordion UIKit code
        run: |
          set -o pipefail
          python3 scripts/minismod_accordion_regression.py 2>&1 | tee accordion-regression.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accordion-regression
          path: |
            accordion-regression.log
            build/accordion-regression/*.log
            build/accordion-regression/*.ips
            build/accordion-regression/*.crash
            build/accordion-regression/fab-*.png
            build/accordion-regression/folder-*.png
            build/accordion-regression/nav-*.png
            build/accordion-regression/row-*.png
