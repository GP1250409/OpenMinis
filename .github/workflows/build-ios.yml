name: Build Unsigned iOS IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build Minis IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup ProviderCustomization.xcconfig
        run: |
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig

      - name: Cache native dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            deps/lame-build
            deps/frameworks
            deps/libs
            deps/include
            deps/resources
          key: ${{ runner.os }}-openminis-deps-${{ hashFiles('deps/**', '.gitmodules') }}

      - name: Install build tools
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          brew install ninja llvm libarchive pkg-config go
          pip3 install meson

      - name: Build Native Dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          chmod +x deps/*.sh
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh

      - name: Build Minis iOS App (Unsigned)
        run: |
          xcodebuild clean build \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            BUILD_DIR="${{ runner.temp }}/build"

      - name: Package to Unsigned IPA
        run: |
          cd "${{ runner.temp }}/build/Release-iphoneos"
          mkdir Payload
          cp -r Minis.app Payload/
          zip -r -q Minis-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Minis-unsigned-ipa
          path: ${{ runner.temp }}/build/Release-iphoneos/Minis-unsigned.ipa
          retention-days: 7
