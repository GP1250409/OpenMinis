name: Build iOS (unsigned)
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Validation regression scope (full or incremental)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - incremental
      baseline_sha:
        description: 'Baseline commit SHA for changed-files verification in incremental mode'
        required: false
        default: ''
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - name: Determine validation scope
        id: scope
        run: |
          set -o pipefail
          python3 scripts/ci_validation_scope.py \
            --mode "${{ inputs.scope || 'full' }}" \
            --baseline "${{ inputs.baseline_sha }}" \
            --out validation-scope.json 2>&1 | tee validation-scope.log
      - name: Bundle identity source gate
        run: |
          set -o pipefail
          python3 scripts/bundle_identity_check.py 2>&1 | tee bundle-identity-source.log
      - name: Check prebuilt native deps
        id: prebuilt_deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native_deps_release.py download
      - name: Xcode & Metal toolchain
        run: |
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version || true
      - name: Install native dep build tools
        if: steps.prebuilt_deps.outputs.hit != 'true'
        run: |
          brew install ninja llvm lld libarchive pkg-config go
          pip3 install --break-system-packages meson || pip3 install meson
      - name: Card dark real hosting regression tests
        if: steps.scope.outputs.run_card_dark == 'true'
        run: |
          set -o pipefail
          python3 scripts/card_dark_regression.py --baseline 2>&1 | tee card-dark-baseline.log
          python3 scripts/card_dark_regression.py 2>&1 | tee card-dark-regression.log
      - name: Layered theme real hosting and image geometry regression tests
        if: steps.scope.outputs.run_theme_suite == 'true'
        run: |
          set -o pipefail
          python3 scripts/image_geometry_regression.py 2>&1 | tee image-geometry-regression.log
          python3 scripts/theme_matrix_regression.py 2>&1 | tee theme-matrix-regression.log
          python3 scripts/settings_menu_regression.py 2>&1 | tee settings-menu-regression.log
          (cd src/ios/MinisTests/Standalone && swift AppearanceSecondarySettingsTests.swift) 2>&1 | tee appearance-secondary-standalone.log
          (cd src/ios/MinisTests/Standalone && swift SendButtonReturnModeMenuTests.swift) 2>&1 | tee send-return-menu-standalone.log
          python3 scripts/appearance_secondary_regression.py 2>&1 | tee appearance-secondary-regression.log
      - name: Attachment URL encoding & XML attribute codec (real production helpers)
        run: |
          set -o pipefail
          python3 scripts/attachment_url_regression.py 2>&1 | tee attachment-url-regression.log
      - name: Status-bar native scroll-to-top lifecycle (real UIKit fixture)
        run: |
          set -o pipefail
          python3 scripts/statusbar_scroll_regression.py 2>&1 | tee statusbar-scroll-regression.log
      # [T-ios-streaming-resume-reentry] The 2026-11-19 status-bar teardown crash:
      # dismantleUIViewController → finishStatusBarScrollToTop → resume →
      # setStreamingUIUpdatesSuspended(false) → objectWillChange.send → SwiftUI
      # body re-entry. This compiles the SHIPPING resume bodies (extracted, with
      # stubs) and drives them, so it runs on Linux too; on the macOS runner the
      # same assertions go through real Combine + GCD and print the second marker.
      - name: Streaming resume-notification re-entry regression
        run: |
          set -o pipefail
          python3 scripts/streaming_resume_regression.py 2>&1 | tee streaming-resume-regression.log
          grep -E 'STREAMING_RESUME_PASS|STREAMING_RESUME_COMBINE_PASS|STREAMING_RESUME_WIRING_PASS|STREAMING_RESUME_SELFTEST_PASS' streaming-resume-regression.log
          # [T-ios-streaming-resume-reentry] the exact incremental-scope exemption
          # for THIS module (34 real-git cases); keeps the allowlist honest in CI.
          python3 scripts/streaming-resume-tests/scope_contract.py 2>&1 | tee streaming-resume-scope.log
      - name: ShowUI interaction theme (typography, palette, action contrast)
        if: steps.scope.outputs.run_theme_suite == 'true'
        run: |
          set -o pipefail
          python3 scripts/showui_interaction_regression.py 2>&1 | tee showui-interaction-regression.log
      - name: Map regression tests
        if: steps.scope.outputs.run_map == 'true'
        run: |
          set -o pipefail
          python3 scripts/map_regression.py --render-simulator 2>&1 | tee map-regression.log
      - name: MOD UIKit regression tests
        if: steps.scope.outputs.run_mod_uikit == 'true'
        run: |
          set -o pipefail
          python3 scripts/minismod_regression.py 2>&1 | tee mod-regression.log
          python3 scripts/genui_height_regression.py 2>&1 | tee genui-height-regression.log
      - name: Thinking & list transaction regression tests
        if: steps.scope.outputs.run_thinking_uikit == 'true'
        run: |
          set -o pipefail
          python3 scripts/thinking_transaction_regression.py 2>&1 | tee thinking-transaction-regression.log
          python3 scripts/toolfold_live_thinking_flash_regression.py 2>&1 | tee fold-flash-regression.log
      - name: Chart layout regression tests
        if: steps.scope.outputs.run_chart_layout == 'true'
        run: |
          set -o pipefail
          python3 scripts/chart_layout_regression.py 2>&1 | tee chart-layout-regression.log
      - name: Chart bitmap rendering regression tests
        if: steps.scope.outputs.run_chart_render == 'true'
        run: |
          set -o pipefail
          python3 scripts/chart_render_regression.py 2>&1 | tee chart-render-regression.log
      - name: Tool fold regression tests [T-fold-lead-gap]
        if: steps.scope.outputs.run_toolfold == 'true'
        run: |
          set -o pipefail
          python3 scripts/toolfold_linux_check.py 2>&1 | tee toolfold-regression.log
          # [T-toolgroup-accordion] Shipping reveal math COMPILED+RUN on Linux
          # plus the static contract that freezes the pre-accordion cut.
          python3 scripts/toolgroup_accordion_regression.py 2>&1 | tee toolgroup-accordion-regression.log
          # [T-toolgroup-original-toggle] The cancelled accordion must stay dead
          # on the production path: the gate above also emits this marker with
          # its own count of no-flight / original-step assertions.
          grep -q 'TOOLGROUP_ORIGINAL_TOGGLE_PASS static=' toolgroup-accordion-regression.log
          grep -q 'TOOLGROUP_ACCORDION_PASS math=27' toolgroup-accordion-regression.log
          # [T-fold-open-card] The genui A/B regression, FULL logic (compiles the
          # production planner and walks show_ui streaming/running/none x the four
          # switch combinations). It had never been executed before this run.
          python3 scripts/genui_fold_barrier_regression.py 2>&1 | tee genui-fold-barrier-regression.log
          python3 scripts/toolfold_uikit_regression.py 2>&1 | tee toolfold-uikit-regression.log
          # [T-user-ask-anchor-clamp] Answered-question card collapse: the shipping
          # ToggleAnchorMath block compiled from MessageListLayout.swift + the wiring
          # guards (pre-clamp before the resize, token-owned anchor, no drag writes).
          python3 scripts/ask_card_anchor_regression.py 2>&1 | tee ask-card-anchor-regression.log
          # [T-user-ask-anchor-clamp] Real UICollectionView + UIHostingConfiguration
          # fixture: shipping MessageListLayout + shipping toggle block, 6 cases.
          python3 scripts/ask_card_anchor_uikit.py 2>&1 | tee ask-card-anchor-uikit.log
      - name: AOJIT images
        if: steps.prebuilt_deps.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p deps/aot && cd deps/aot
          # The unauthenticated /releases/download/ URL returned 503/504 for most of an
          # afternoon (three failed runs); the authenticated asset API served all eight
          # files at their exact sizes. Same assets, same tag; only the transport differs.
          API=https://api.github.com/repos/GP1250409/OpenMinis
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            $API/releases/tags/aot-1f3bb5a0 -o rel.json
          for g in core core-cryptossl imaging node python ssh tools pcre2; do
            id=$(python3 -c "import json,sys;print([a['id'] for a in json.load(open('rel.json'))['assets'] if a['name']=='aot-$g.tar.xz'][0])")
            curl -fsSL --retry 6 --retry-delay 8 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              -o aot-$g.tar.xz $API/releases/assets/$id
            tar -xJf aot-$g.tar.xz && rm aot-$g.tar.xz
          done
          # file names the app catalog expects (AOJITImage.catalog); symbols inside need no change
          mv_() { src=$(ls */aot_$1.S | head -1); cp "$src" "aot_$2.S"; }
          mv_ musl musl_1.2.5-r8;            mv_ busybox busybox_1.37.0-r8;   mv_ zlib zlib_1.3.1-r2
          mv_ crypto libcrypto_3.3.2-r4;     mv_ ssl libssl_3.3.2-r4;         mv_ python python3_3.12.15-r0
          mv_ node nodejs_22.23.4-r0;        mv_ sqlite sqlite_3.48.0-r4;     mv_ imaging pillow_11.0.0-r0
          mv_ webp libwebp_1.4.0-r0;         mv_ jpeg libjpeg_3.0.4-r0;       mv_ numpy numpy_2.1.3-r0
          mv_ pcre2 pcre2_10.43-r1;          mv_ ssh ssh_9.9_p2-r0;             mv_ scp scp_9.9_p2-r0
          for m in json hashlib blake2 struct datetime binascii math zlib socket select; do mv_ py$m py_${m}_3.12.15-r0; done
          rm -rf core core-cryptossl imaging node python ssh tools pcre2
          ls -la aot_*.S | wc -l; du -sh .
      - name: Build native deps
        if: steps.prebuilt_deps.outputs.hit != 'true'
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          export GOTOOLCHAIN=go1.25.5
          which clang ld.lld lld go || true
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
      - name: Publish prebuilt native deps
        if: steps.prebuilt_deps.outputs.hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/native_deps_release.py publish
      - name: Customization
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=11501 CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -n 100
      - name: Package
        run: |
          APP=$(python3 -c 'from pathlib import Path; print(next(Path("build/Build/Products").glob("*/Minis.app")))')
          echo "APP=$APP"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry Minis-mod-unsigned.ipa Payload)
          ls -la out
      - name: Bundle identity IPA gate
        run: |
          set -o pipefail
          python3 scripts/bundle_identity_check.py --ipa out/Minis-mod-unsigned.ipa 2>&1 | tee bundle-identity-ipa.log
      - uses: actions/upload-artifact@v4
        with: { name: Minis-mod-unsigned, path: out/Minis-mod-unsigned.ipa }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-validation-logs
          path: |
            validation-scope.json
            validation-scope.log
            bundle-identity-source.log
            bundle-identity-ipa.log
            thinking-transaction-regression.log
            fold-flash-regression.log
            build/thinking-transaction/
            build/toolfold-live-thinking-flash/
            card-dark-baseline.log
            build/card-dark-baseline/*.png
            build/card-dark-baseline/*.log
            image-geometry-regression.log
            theme-matrix-regression.log
            build/theme-matrix/*.png
            build/theme-matrix/*.log
            build/theme-matrix/ProductionRenderer.swift
            attachment-url-regression.log
            build/attachment-url/compile.log
            # [T-user-ask-anchor-flight] Both halves of the combined candidate:
            # the card anchor gate, and the status-bar flight gate (its own log
            # is the current-run evidence for STATUSBAR_SCROLL_*).
            statusbar-scroll-regression.log
            # [T-ios-streaming-resume-reentry] the resume-notification gate and
            # its incremental-scope self-proof (34 real-git cases).
            streaming-resume-regression.log
            streaming-resume-scope.log
            ask-card-anchor-regression.log
            ask-card-anchor-uikit.log
            # Exactly seven case PNGs + compile.log/results.log. The root gate
            # compares the artifact's *.png names with the log's
            # `ASK_CARD_ANCHOR_UIKIT_PNG 7` list one by one, so uploading only the
            # tee'd stdout would leave the run unverifiable.
            build/ask-card-uikit/*.png
            build/ask-card-uikit/compile.log
            build/ask-card-uikit/results.log
            # Hosted status-bar UIKit app: console text, compile log and a
            # simulator screenshot for whatever the flight did or did not do.
            build/statusbar-scroll-uikit/*
            build/attachment-url/result.log
            showui-interaction-regression.log
            build/showui-interaction/pure.log
            build/showui-interaction/launch.log
            build/showui-interaction/compile.log
            build/showui-interaction/asset-compile.log
            build/showui-interaction/asset-info.plist
            build/showui-interaction/png/*.png
            build/showui-interaction/png/result.log
            build/showui-interaction/ProductionRenderer.swift
            settings-menu-regression.log
            build/settings-menu/*.png
            build/settings-menu/*.log
            build/settings-menu/ProductionRenderer.swift
            appearance-secondary-standalone.log
            send-return-menu-standalone.log
            appearance-secondary-regression.log
            build/appearance-secondary/*.png
            build/appearance-secondary/*.log
            build/appearance-secondary/ProductionHarness.swift
            card-dark-regression.log
            build/card-dark/*.png
            build/card-dark/*.log
            build/card-dark/ProductionRenderer.swift
            mod-regression.log
            genui-height-regression.log
            chart-layout-regression.log
            chart-render-regression.log
            build/chart-render/
            map-regression.log
            build/map-regression/
            build/map-render/*.png
            build/map-render/*.log
            build/map-render/compile-command.txt
            toolfold-regression.log
            toolfold-uikit-regression.log
            build/toolfold-uikit/*.png
            build/toolfold-uikit/*.log
            build/toolfold-uikit/ProductionToolGroupRow.swift
            build/genui-height/
            build.log
            build/mod-regression/*.swift
