name: Build iOS (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [mod]
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Tools
        run: |
          xcodebuild -version
          brew install ninja llvm libarchive pkg-config go
          pip3 install --break-system-packages meson || pip3 install meson
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version || true
      - name: Cache native deps
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: deps-${{ runner.os }}-${{ hashFiles('deps/*.sh', '.gitmodules') }}-${{ hashFiles('deps/ish/**') }}
      - name: Build native deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
      - name: Customization
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build app
        run: |
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" build 2>&1 | tail -n 300
      - name: Package
        run: |
          APP=$(find build/Build/Products -name 'Minis.app' -maxdepth 3 | head -1)
          echo "APP=$APP"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry Minis-mod-unsigned.ipa Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: Minis-mod-unsigned, path: out/Minis-mod-unsigned.ipa }
