name: Build iOS (unsigned)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Tools
        run: |
          xcodebuild -version
          brew install ninja llvm lld libarchive pkg-config go
          pip3 install --break-system-packages meson || pip3 install meson
          xcodebuild -downloadComponent MetalToolchain || true
          xcrun -sdk iphoneos metal --version || true
      - name: MOD UIKit regression tests
        run: |
          set -o pipefail
          python3 scripts/minismod_regression.py 2>&1 | tee mod-regression.log
      - name: AOJIT images
        run: |
          mkdir -p deps/aot && cd deps/aot
          B=https://github.com/GP1250409/OpenMinis/releases/download/aot-1f3bb5a0
          for g in core core-cryptossl imaging node python ssh tools pcre2; do
            curl -fsSL -o aot-$g.tar.xz $B/aot-$g.tar.xz && tar -xJf aot-$g.tar.xz && rm aot-$g.tar.xz
          done
          # file names the app catalog expects (AOJITImage.catalog); symbols inside need no change
          mv_() { src=$(ls */aot_$1.S | head -1); cp "$src" "aot_$2.S"; }
          mv_ musl musl_1.2.5-r8;            mv_ busybox busybox_1.37.0-r8;   mv_ zlib zlib_1.3.1-r2
          mv_ crypto libcrypto_3.3.2-r4;     mv_ ssl libssl_3.3.2-r4;         mv_ python python3_3.12.15-r0
          mv_ node nodejs_22.23.4-r0;        mv_ sqlite sqlite_3.48.0-r4;     mv_ imaging pillow_11.0.0-r0
          mv_ webp libwebp_1.4.0-r0;         mv_ jpeg libjpeg_3.0.4-r0;       mv_ numpy numpy_2.1.3-r0
          mv_ pcre2 pcre2_10.43-r1;          mv_ ssh ssh_9.9_p2-r0;             mv_ scp scp_9.9_p2-r0
          for m in json hashlib blake2 struct datetime binascii math zlib socket select; do mv_ py$m py_${m}_3.12.15-r0; done
          rm -rf core core-cryptossl imaging node python ssh tools pcre2
          ls -la aot_*.S | wc -l; du -sh .
      - name: Cache native deps
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            deps/libs
            deps/include
            deps/frameworks
            deps/resources
            deps/lame-build
          key: deps-${{ runner.os }}-${{ hashFiles('deps/*.sh', '.gitmodules') }}-${{ hashFiles('deps/ish/**') }}-aot1f3bb5a0-v2
      - name: Build native deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          export PATH="$(brew --prefix llvm)/bin:$(brew --prefix lld)/bin:$PATH"
          export GOTOOLCHAIN=go1.25.5
          which clang ld.lld lld go || true
          go version
          ./deps/build_lame.sh
          ./deps/build_ffmpeg.sh
          ./deps/build_ish.sh
          ./deps/prepare_alpine_rootfs.sh
          ./deps/build_rclone_ios.sh
      - name: Customization
        run: cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project src/ios/Minis.xcodeproj -scheme Minis \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CURRENT_PROJECT_VERSION=11501 CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -n 100
      - name: Package
        run: |
          APP=$(python3 -c 'from pathlib import Path; print(next(Path("build/Build/Products").glob("*/Minis.app")))')
          echo "APP=$APP"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry Minis-mod-unsigned.ipa Payload)
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: Minis-mod-unsigned, path: out/Minis-mod-unsigned.ipa }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mod-validation-logs
          path: |
            mod-regression.log
            build.log
            build/mod-regression/*.swift

