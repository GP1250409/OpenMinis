name: Probe iOS16 context menu
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Run probe
        run: python3 scripts/probe16/run.py 2>&1 | tee probe16.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe16
          path: |
            probe16.log
            build/probe16/*.png
